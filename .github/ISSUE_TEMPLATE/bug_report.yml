name: Bug report
description: Report an unexpected crawler result or API behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    attributes:
      label: Affected source
      placeholder: root, sw, skb_swuniv, cse, or sco
